<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 330" width="960" height="330" font-family="'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif">
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#64748b"/></marker></defs>
  <rect x="1" y="1" width="958" height="328" rx="16" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="40" y="48" font-size="22" font-weight="700" fill="#0f172a">실패 하나가 층을 넘는 모습</text>
  <text x="40" y="74" font-size="13" fill="#64748b">(0, 0) → 거의 대척점인 (0.5, 179.7)을 Vincenty 역문제로 풀 때</text>

  <rect x="30" y="100" width="270" height="200" rx="12" fill="#f0fdf4" stroke="#22c55e"/>
  <text x="50" y="130" font-size="16" font-weight="700" fill="#15803d">C++ 코어</text>
  <text x="50" y="160" font-size="12" fill="#334155" font-family="Menlo,monospace">|λ| &gt; π</text>
  <text x="50" y="182" font-size="13" fill="#475569">반복이 흔들리며 수렴 안 함</text>
  <rect x="50" y="205" width="230" height="70" rx="8" fill="#ffffff" stroke="#86efac"/>
  <text x="62" y="232" font-size="11" fill="#166534" font-family="Menlo,monospace">std::unexpected(</text>
  <text x="62" y="254" font-size="11" fill="#166534" font-family="Menlo,monospace"> GeodesyError::not_converged)</text>

  <line x1="302" y1="200" x2="342" y2="200" stroke="#64748b" stroke-width="2" marker-end="url(#a)"/>

  <rect x="345" y="100" width="270" height="200" rx="12" fill="#eff6ff" stroke="#3b82f6"/>
  <text x="365" y="130" font-size="16" font-weight="700" fill="#1d4ed8">C 다리층</text>
  <text x="365" y="160" font-size="12" fill="#334155" font-family="Menlo,monospace">if (!r) return to_c(r.error());</text>
  <text x="365" y="182" font-size="13" fill="#475569">*out = ... 까지 가지 않음</text>
  <rect x="365" y="205" width="230" height="70" rx="8" fill="#ffffff" stroke="#93c5fd"/>
  <text x="377" y="232" font-size="11" fill="#1e40af" font-family="Menlo,monospace">return MA_NOT_CONVERGED;</text>
  <text x="377" y="254" font-size="11" fill="#1e40af">out은 호출 전 값 그대로</text>

  <line x1="617" y1="200" x2="657" y2="200" stroke="#64748b" stroke-width="2" marker-end="url(#a)"/>

  <rect x="660" y="100" width="270" height="200" rx="12" fill="#fff7ed" stroke="#f97316"/>
  <text x="680" y="130" font-size="16" font-weight="700" fill="#c2410c">Swift</text>
  <text x="680" y="160" font-size="12" fill="#334155" font-family="Menlo,monospace">guard status == MA_OK</text>
  <text x="680" y="182" font-size="13" fill="#475569">상태 코드를 오류 타입으로</text>
  <rect x="680" y="205" width="230" height="70" rx="8" fill="#ffffff" stroke="#fdba74"/>
  <text x="692" y="232" font-size="11" fill="#9a3412" font-family="Menlo,monospace">throw</text>
  <text x="692" y="254" font-size="11" fill="#9a3412" font-family="Menlo,monospace"> GeodesyError.notConverged</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 400" width="960" height="400" font-family="'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif">
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#64748b"/></marker><marker id="p" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#7c3aed"/></marker><marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker></defs>
<rect x="1" y="1" width="958" height="398" rx="16" fill="#ffffff" stroke="#e2e8f0"/>
<text x="40" y="48" font-size="22" font-weight="700" fill="#0f172a">컴파일러는 번역가다</text>
<text x="40" y="74" font-size="13" fill="#64748b">언어마다 앞단은 다르지만 뼈대는 같다: 이해하기 → 중간 코드 → CPU 말로 바꾸기 → 묶기</text>
<rect x="40" y="110" width="150" height="120" rx="10" fill="#f8fafc" stroke="#cbd5e1"/>
<text x="54" y="134" font-size="14" font-weight="700" fill="#334155">소스 코드</text>
<text x="54" y="156" font-size="12" fill="#475569" xml:space="preserve">사람이 읽는 글</text>
<text x="54" y="175" font-size="12" fill="#475569" xml:space="preserve">.cpp / .swift</text>
<rect x="210" y="110" width="150" height="120" rx="10" fill="#f8fafc" stroke="#cbd5e1"/>
<text x="224" y="134" font-size="14" font-weight="700" fill="#334155">프론트엔드</text>
<text x="224" y="156" font-size="12" fill="#475569" xml:space="preserve">문법 분석</text>
<text x="224" y="175" font-size="12" fill="#475569" xml:space="preserve">타입 검사</text>
<text x="224" y="194" font-size="12" fill="#475569" xml:space="preserve">→ 언어를 &quot;이해&quot;</text>
<rect x="380" y="110" width="150" height="120" rx="10" fill="#f5f3ff" stroke="#8b5cf6"/>
<text x="394" y="134" font-size="14" font-weight="700" fill="#6d28d9">중간 코드 (IR)</text>
<text x="394" y="156" font-size="12" fill="#5b21b6" xml:space="preserve">언어·CPU와 무관한</text>
<text x="394" y="175" font-size="12" fill="#5b21b6" xml:space="preserve">단순한 명령</text>
<text x="394" y="194" font-size="12" fill="#5b21b6" xml:space="preserve">+ 최적화</text>
<rect x="550" y="110" width="150" height="120" rx="10" fill="#f5f3ff" stroke="#8b5cf6"/>
<text x="564" y="134" font-size="14" font-weight="700" fill="#6d28d9">백엔드</text>
<text x="564" y="156" font-size="12" fill="#5b21b6" xml:space="preserve">CPU에 맞게</text>
<text x="564" y="175" font-size="12" fill="#5b21b6" xml:space="preserve">어셈블리 →</text>
<text x="564" y="194" font-size="12" fill="#5b21b6" xml:space="preserve">기계어(숫자)</text>
<rect x="720" y="110" width="150" height="120" rx="10" fill="#f8fafc" stroke="#cbd5e1"/>
<text x="734" y="134" font-size="14" font-weight="700" fill="#334155">목적 파일 → 링크</text>
<text x="734" y="156" font-size="12" fill="#475569" xml:space="preserve">.o 여러 개를</text>
<text x="734" y="175" font-size="12" fill="#475569" xml:space="preserve">하나로 묶어</text>
<text x="734" y="194" font-size="12" fill="#475569" xml:space="preserve">실행 파일로</text>
<line x1="192" y1="170" x2="206" y2="170" stroke="#64748b" stroke-width="2" marker-end="url(#a)"/>
<line x1="362" y1="170" x2="376" y2="170" stroke="#64748b" stroke-width="2" marker-end="url(#a)"/>
<line x1="532" y1="170" x2="546" y2="170" stroke="#64748b" stroke-width="2" marker-end="url(#a)"/>
<line x1="702" y1="170" x2="716" y2="170" stroke="#64748b" stroke-width="2" marker-end="url(#a)"/>
<text x="210" y="252" font-size="12" fill="#64748b" text-anchor="start" xml:space="preserve">언어마다 다름 (Clang / swiftc)</text>
<line x1="380" y1="246" x2="700" y2="246" stroke="#8b5cf6" stroke-width="2"/>
<text x="540" y="266" font-size="12" fill="#6d28d9" font-weight="700" text-anchor="middle" xml:space="preserve">LLVM (C++·Swift 공통)</text>
<text x="40" y="310" font-size="13" fill="#334155" text-anchor="start" xml:space="preserve">CPU는 글자를 읽지 못한다. 읽는 건 &quot;레지스터 d0에 d1을 곱하라&quot; 같은 명령을 숫자로 적은 기계어뿐이다.</text>
<text x="40" y="334" font-size="13" fill="#334155" text-anchor="start" xml:space="preserve">arm64(아이폰·Apple Silicon Mac)는 명령 하나가 4바이트 숫자다. 예: fmul d0, d0, d1  =  1e610800</text>
</svg>
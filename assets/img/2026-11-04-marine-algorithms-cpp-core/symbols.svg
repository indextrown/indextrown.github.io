<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 470" width="960" height="470" font-family="'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif">
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#64748b"/></marker>
  <marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker></defs>
  <rect x="1" y="1" width="958" height="468" rx="16" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="40" y="48" font-size="22" font-weight="700" fill="#0f172a">링커는 이름으로 함수를 찾는다</text>
  <text x="40" y="74" font-size="13" fill="#64748b">Swift 쪽 MiniNav.o는 C 헤더를 보고 _mn_haversine_distance라는 이름을 찾는다 (실측: nm)</text>

  <rect x="40" y="100" width="260" height="120" rx="12" fill="#fff7ed" stroke="#f97316"/>
  <text x="60" y="130" font-size="16" font-weight="700" fill="#c2410c">MiniNav.o (Swift)</text>
  <text x="60" y="156" font-size="13" fill="#475569">mn_haversine_distance(...)를 부름</text>
  <text x="60" y="186" font-size="12" fill="#ea580c" font-family="Menlo,monospace">필요: _mn_haversine_distance</text>

  <rect x="420" y="100" width="500" height="120" rx="12" fill="#f0fdf4" stroke="#22c55e"/>
  <text x="440" y="130" font-size="16" font-weight="700" fill="#15803d">CMiniNav.o — extern "C" 있음</text>
  <text x="440" y="160" font-size="12" fill="#166534" font-family="Menlo,monospace">T _mn_haversine_distance</text>
  <text x="440" y="182" font-size="12" fill="#166534" font-family="Menlo,monospace">T _mn_average_speed</text>
  <text x="440" y="204" font-size="12" fill="#64748b" font-family="Menlo,monospace">T __ZN7mininav18haversine_distanceE...  (C++ 코어)</text>
  <line x1="302" y1="160" x2="416" y2="160" stroke="#16a34a" stroke-width="2.5" marker-end="url(#a)"/>
  <text x="318" y="150" font-size="13" font-weight="700" fill="#16a34a">이름 일치</text>

  <rect x="420" y="260" width="500" height="120" rx="12" fill="#fef2f2" stroke="#ef4444"/>
  <text x="440" y="290" font-size="16" font-weight="700" fill="#b91c1c">CMiniNav.o — extern "C" 없음</text>
  <text x="440" y="320" font-size="12" fill="#991b1b" font-family="Menlo,monospace">T __Z21mn_haversine_distance13mn_coordinateS_</text>
  <text x="440" y="342" font-size="12" fill="#991b1b" font-family="Menlo,monospace">T __Z16mn_average_speed13mn_coordinateS_dPd</text>
  <text x="440" y="364" font-size="12" fill="#64748b">C++가 타입 정보를 이름에 섞었다 (name mangling)</text>
  <path d="M170,222 C170,300 300,320 416,320" fill="none" stroke="#dc2626" stroke-width="2.5" stroke-dasharray="6 4" marker-end="url(#r)"/>
  <text x="150" y="300" font-size="13" font-weight="700" fill="#dc2626">이름 불일치</text>

  <rect x="40" y="400" width="880" height="50" rx="10" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="60" y="431" font-size="13" fill="#b91c1c" font-family="Menlo,monospace">Undefined symbols for architecture arm64: "_mn_haversine_distance", referenced from: ... in MiniNav.o</text>

<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="600" viewBox="0 0 1400 600" role="img" aria-labelledby="title desc">
  <title id="title">팀의 아이디어를 React Native 화면으로 검증하는 흐름</title>
  <desc id="desc">디자이너, 백엔드 개발자, iOS 개발자, Android 개발자가 AI를 활용해 PopPang-RN에서 공통 화면을 만들고 데모 앱에서 확인한 뒤 iOS와 Android 앱에 함께 배포한다.</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="7" stdDeviation="10" flood-color="#0f172a" flood-opacity="0.08"/>
    </filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 Z" fill="#64748b"/>
    </marker>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Apple SD Gothic Neo", sans-serif; fill: #0f172a; }
      .eyebrow { font-size: 18px; font-weight: 800; letter-spacing: 1.2px; }
      .heading { font-size: 30px; font-weight: 800; }
      .label { font-size: 21px; font-weight: 750; }
      .body { font-size: 18px; font-weight: 500; fill: #475569; }
      .note { font-size: 23px; font-weight: 800; }
    </style>
  </defs>

  <rect width="1400" height="600" rx="32" fill="#f8fafc"/>

  <text x="58" y="62" class="eyebrow" fill="#64748b">TEAM</text>
  <text x="58" y="103" class="heading">누구나 아이디어를 제안</text>

  <g transform="translate(64 140)">
    <circle cx="44" cy="40" r="30" fill="#f97316"/>
    <path d="M6 105c0-31 16-50 38-50s38 19 38 50v12H6z" fill="#fb923c"/>
    <circle cx="34" cy="37" r="4" fill="#ffffff"/>
    <circle cx="54" cy="37" r="4" fill="#ffffff"/>
    <path d="M35 51c6 5 12 5 18 0" fill="none" stroke="#ffffff" stroke-width="4" stroke-linecap="round"/>
  </g>
  <text x="164" y="188" class="label">디자이너</text>
  <text x="164" y="219" class="body">화면과 사용 흐름</text>

  <g transform="translate(64 294)">
    <circle cx="44" cy="40" r="30" fill="#9333ea"/>
    <path d="M6 105c0-31 16-50 38-50s38 19 38 50v12H6z" fill="#a855f7"/>
    <circle cx="34" cy="37" r="4" fill="#ffffff"/>
    <circle cx="54" cy="37" r="4" fill="#ffffff"/>
    <path d="M35 51c6 5 12 5 18 0" fill="none" stroke="#ffffff" stroke-width="4" stroke-linecap="round"/>
  </g>
  <text x="164" y="342" class="label">백엔드 개발자</text>
  <text x="164" y="373" class="body">데이터와 기능 아이디어</text>

  <g transform="translate(64 448)">
    <circle cx="34" cy="30" r="25" fill="#2563eb"/>
    <path d="M3 88c0-26 13-42 31-42s31 16 31 42v9H3z" fill="#3b82f6"/>
  </g>
  <text x="143" y="487" class="label">iOS</text>

  <g transform="translate(240 448)">
    <circle cx="34" cy="30" r="25" fill="#16a34a"/>
    <path d="M3 88c0-26 13-42 31-42s31 16 31 42v9H3z" fill="#22c55e"/>
  </g>
  <text x="319" y="487" class="label">Android</text>

  <path d="M355 189 H438 Q470 189 494 219 L524 257" fill="none" stroke="#cbd5e1" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M355 343 H450 Q476 343 500 319 L524 295" fill="none" stroke="#cbd5e1" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M414 479 H438 Q474 479 494 442 L527 381" fill="none" stroke="#cbd5e1" stroke-width="3" marker-end="url(#arrow)"/>


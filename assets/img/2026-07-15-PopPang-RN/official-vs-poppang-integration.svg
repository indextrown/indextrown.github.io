<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="720" viewBox="0 0 1400 720" role="img" aria-labelledby="title desc">
  <title id="title">React Native 공식 통합 방식과 팝팡이 선택한 방식 비교</title>
  <desc id="desc">공식 통합 방식은 React Native 프로젝트 안에 기존 iOS와 Android 앱을 배치한다. 팝팡은 기존 앱을 유지하고 별도 프로젝트에서 빌드한 XCFramework와 AAR만 각 앱에 연결한다.</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0f172a" flood-opacity="0.08"/>
    </filter>
    <marker id="blue-arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 Z" fill="#38bdf8"/>
    </marker>
    <marker id="green-arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 Z" fill="#22c55e"/>
    </marker>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Apple SD Gothic Neo", sans-serif; fill: #0f172a; }
      .eyebrow { font-size: 19px; font-weight: 800; letter-spacing: 1.1px; }
      .heading { font-size: 31px; font-weight: 800; }
      .label { font-size: 23px; font-weight: 800; }
      .body { font-size: 18px; font-weight: 500; fill: #475569; }
      .small { font-size: 16px; font-weight: 700; fill: #475569; }
      .metric { font-size: 23px; font-weight: 800; }
    </style>
  </defs>

  <rect width="1400" height="720" rx="32" fill="#f8fafc"/>

  <g filter="url(#shadow)">
    <rect x="44" y="44" width="620" height="632" rx="28" fill="#ffffff" stroke="#fecaca" stroke-width="2"/>
    <rect x="736" y="44" width="620" height="632" rx="28" fill="#ffffff" stroke="#bbf7d0" stroke-width="2"/>
  </g>

  <rect x="78" y="76" width="188" height="40" rx="20" fill="#fee2e2"/>
  <text x="172" y="103" class="eyebrow" text-anchor="middle" fill="#b91c1c">OFFICIAL GUIDE</text>
  <text x="78" y="157" class="heading">React Native 프로젝트가 중심</text>

  <rect x="78" y="187" width="552" height="366" rx="24" fill="#fff7f7" stroke="#fca5a5" stroke-width="2" stroke-dasharray="8 7"/>

  <g transform="translate(106 211)">
    <rect width="50" height="50" rx="13" fill="#0f172a"/>
    <g transform="translate(5 7) scale(.36)" aria-label="React Native logo">
      <path d="m56 61.832c5.891 0 10.667-4.776 10.667-10.667s-4.777-10.667-10.667-10.667-10.666 4.776-10.666 10.667 4.774 10.667 10.666 10.667z" fill="#61dafb"/>
      <g fill="none" stroke="#61dafb" stroke-width="5.333">
        <path d="m56 75.165c29.455 0 53.333-10.745 53.333-24s-23.878-24-53.333-24-53.334 10.745-53.334 24 23.879 24 53.334 24z"/>
        <path d="m35.215 63.165c14.728 25.509 35.972 40.815 47.451 34.188 11.48-6.628 8.846-32.68-5.882-58.188-14.727-25.51-35.972-40.816-47.45-34.188-11.48 6.627-8.846 32.679 5.881 58.188z"/>
        <path d="m35.215 39.165c-14.727 25.509-17.36 51.56-5.882 58.188 11.48 6.627 32.724-8.68 47.451-34.188 14.728-25.51 17.362-51.56 5.883-58.188-11.48-6.628-32.724 8.679-47.452 34.188z"/>
      </g>
    </g>
  </g>
  <text x="176" y="234" class="label">React Native 프로젝트</text>
  <text x="176" y="258" class="small">개발 환경의 루트</text>

  <path d="M354 274 V302 H224 V326" fill="none" stroke="#f87171" stroke-width="4"/>
  <path d="M354 274 V302 H484 V326" fill="none" stroke="#f87171" stroke-width="4"/>
  <circle cx="354" cy="302" r="7" fill="#f87171"/>

  <rect x="106" y="326" width="236" height="150" rx="20" fill="#eff6ff" stroke="#bfdbfe" stroke-width="2"/>
  <circle cx="224" cy="365" r="24" fill="#2563eb"/>
  <text x="224" y="372" font-size="17" font-weight="800" text-anchor="middle" fill="#ffffff">iOS</text>
  <text x="224" y="413" class="label" text-anchor="middle">기존 iOS 앱</text>
  <text x="224" y="440" class="body" text-anchor="middle">ios/</text>
  <text x="224" y="464" class="body" text-anchor="middle">CocoaPods</text>

  <rect x="366" y="326" width="236" height="150" rx="20" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="2"/>
  <circle cx="484" cy="365" r="24" fill="#16a34a"/>
  <text x="484" y="371" font-size="14" font-weight="800" text-anchor="middle" fill="#ffffff">AOS</text>
  <text x="484" y="413" class="label" text-anchor="middle">기존 Android 앱</text>
  <text x="484" y="440" class="body" text-anchor="middle">android/</text>
  <text x="484" y="464" class="body" text-anchor="middle">RN Gradle Plugin</text>

  <rect x="78" y="594" width="552" height="54" rx="18" fill="#fff1f2"/>
  <text x="354" y="629" class="metric" text-anchor="middle" fill="#be123c">기존 앱이 React Native 프로젝트 안으로</text>

  <circle cx="700" cy="360" r="31" fill="#e2e8f0"/>
  <text x="700" y="368" font-size="20" font-weight="900" text-anchor="middle" fill="#64748b">VS</text>

  <rect x="770" y="76" width="226" height="40" rx="20" fill="#dcfce7"/>
  <text x="883" y="103" class="eyebrow" text-anchor="middle" fill="#15803d">POPPANG CHOICE</text>
  <text x="770" y="157" class="heading">기존 네이티브 앱이 중심</text>

  <rect x="770" y="194" width="250" height="150" rx="22" fill="#eff6ff" stroke="#bfdbfe" stroke-width="2"/>
  <circle cx="895" cy="233" r="24" fill="#2563eb"/>
  <text x="895" y="240" font-size="17" font-weight="800" text-anchor="middle" fill="#ffffff">iOS</text>
  <text x="895" y="281" class="label" text-anchor="middle">기존 iOS 앱</text>
  <text x="895" y="314" class="body" text-anchor="middle">Swift Package Manager 유지</text>

  <rect x="1072" y="194" width="250" height="150" rx="22" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="2"/>
  <circle cx="1197" cy="233" r="24" fill="#16a34a"/>
  <text x="1197" y="239" font-size="14" font-weight="800" text-anchor="middle" fill="#ffffff">AOS</text>
  <text x="1197" y="281" class="label" text-anchor="middle">기존 Android 앱</text>
  <text x="1197" y="314" class="body" text-anchor="middle">Gradle 유지</text>

  <path d="M915 457 V398 H895 V356" fill="none" stroke="#38bdf8" stroke-width="4" marker-end="url(#blue-arrow)"/>
  <path d="M1177 457 V398 H1197 V356" fill="none" stroke="#22c55e" stroke-width="4" marker-end="url(#green-arrow)"/>

  <rect x="807" y="374" width="154" height="34" rx="17" fill="#e0f2fe"/>
  <text x="884" y="397" class="small" text-anchor="middle" fill="#0369a1">XCFramework</text>
  <rect x="1131" y="374" width="132" height="34" rx="17" fill="#dcfce7"/>
  <text x="1197" y="397" class="small" text-anchor="middle" fill="#15803d">AAR · Maven</text>

  <rect x="876" y="432" width="340" height="116" rx="24" fill="#e0f2fe" stroke="#7dd3fc" stroke-width="2"/>
  <g transform="translate(905 461)">
    <rect width="58" height="58" rx="15" fill="#0f172a"/>
    <g transform="translate(7 9) scale(.4)" aria-label="React Native logo">
      <path d="m56 61.832c5.891 0 10.667-4.776 10.667-10.667s-4.777-10.667-10.667-10.667-10.666 4.776-10.666 10.667 4.774 10.667 10.666 10.667z" fill="#61dafb"/>
      <g fill="none" stroke="#61dafb" stroke-width="5.333">
        <path d="m56 75.165c29.455 0 53.333-10.745 53.333-24s-23.878-24-53.333-24-53.334 10.745-53.334 24 23.879 24 53.334 24z"/>
        <path d="m35.215 63.165c14.728 25.509 35.972 40.815 47.451 34.188 11.48-6.628 8.846-32.68-5.882-58.188-14.727-25.51-35.972-40.816-47.45-34.188-11.48 6.627-8.846 32.679 5.881 58.188z"/>
        <path d="m35.215 39.165c-14.727 25.509-17.36 51.56-5.882 58.188 11.48 6.627 32.724-8.68 47.451-34.188 14.728-25.51 17.362-51.56 5.883-58.188-11.48-6.628-32.724 8.679-47.452 34.188z"/>
      </g>
    </g>
  </g>
  <text x="988" y="474" class="label">PopPang-RN</text>
  <text x="988" y="506" class="body">별도 프로젝트에서 빌드</text>

  <rect x="770" y="594" width="552" height="54" rx="18" fill="#ecfdf5"/>
  <text x="1046" y="629" class="metric" text-anchor="middle" fill="#047857">React Native 모듈이 기존 앱 안으로</text>
</svg>

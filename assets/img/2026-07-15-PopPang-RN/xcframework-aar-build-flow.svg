  <text x="495" y="663" class="footer" text-anchor="middle">Metro</text>
  <line x1="562" y1="657" x2="600" y2="657" stroke="#fb923c" stroke-width="3" marker-end="url(#orange-arrow)"/>
  <rect x="615" y="638" width="300" height="38" rx="14" fill="#ffffff" stroke="#fed7aa"/>
  <text x="765" y="663" class="footer" text-anchor="middle">iOS · Android JavaScript bundle</text>
  <line x1="927" y1="657" x2="965" y2="657" stroke="#fb923c" stroke-width="3" marker-end="url(#orange-arrow)"/>
  <rect x="980" y="638" width="345" height="38" rx="14" fill="#ffffff" stroke="#fed7aa"/>
  <text x="1152.5" y="663" class="footer" text-anchor="middle">네이티브 패키지와 함께 릴리스</text>

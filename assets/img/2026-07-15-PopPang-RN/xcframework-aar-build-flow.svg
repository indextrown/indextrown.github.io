<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="720" viewBox="0 0 1400 720" role="img" aria-labelledby="title desc">
  <title id="title">PopPang-RN 소스가 XCFramework와 AAR로 만들어지는 흐름</title>
  <desc id="desc">PopPang-RN 소스에서 iOS는 xcodebuild와 컴파일러, 링커를 거쳐 XCFramework와 Swift Package로 기존 iOS 앱에 연결되고, Android는 Gradle과 Android Gradle Plugin, 컴파일러와 네이티브 툴체인을 거쳐 AAR과 Maven 저장소로 기존 Android 앱에 연결된다. JavaScript bundle은 Metro로 별도 생성해 네이티브 패키지와 함께 릴리스한다.</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="7" stdDeviation="10" flood-color="#0f172a" flood-opacity="0.08"/>
    </filter>
    <marker id="neutral-arrow" markerWidth="12" markerHeight="12" refX="11" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L12,6 L0,12 Z" fill="#94a3b8"/>
    </marker>
    <marker id="blue-arrow" markerWidth="12" markerHeight="12" refX="11" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L12,6 L0,12 Z" fill="#38bdf8"/>
    </marker>
    <marker id="green-arrow" markerWidth="12" markerHeight="12" refX="11" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L12,6 L0,12 Z" fill="#22c55e"/>
    </marker>
    <marker id="orange-arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L10,5 L0,10 Z" fill="#fb923c"/>
    </marker>
    <symbol id="rn-logo" viewBox="0 0 112 103">
      <path d="m56 61.832c5.891 0 10.667-4.776 10.667-10.667s-4.777-10.667-10.667-10.667-10.666 4.776-10.666 10.667 4.774 10.667 10.666 10.667z" fill="#61dafb"/>
      <g fill="none" stroke="#61dafb" stroke-width="5.333">
        <path d="m56 75.165c29.455 0 53.333-10.745 53.333-24s-23.878-24-53.333-24-53.334 10.745-53.334 24 23.879 24 53.334 24z"/>
        <path d="m35.215 63.165c14.728 25.509 35.972 40.815 47.451 34.188 11.48-6.628 8.846-32.68-5.882-58.188-14.727-25.51-35.972-40.816-47.45-34.188-11.48 6.627-8.846 32.679 5.881 58.188z"/>
        <path d="m35.215 39.165c-14.727 25.509-17.36 51.56-5.882 58.188 11.48 6.627 32.724-8.68 47.451-34.188 14.728-25.51 17.362-51.56 5.883-58.188-11.48-6.628-32.724 8.679-47.452 34.188z"/>
      </g>
    </symbol>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Apple SD Gothic Neo", sans-serif; fill: #0f172a; }
      .eyebrow { font-size: 17px; font-weight: 800; letter-spacing: 1px; }
      .source-heading { font-size: 28px; font-weight: 800; }
      .lane-heading { font-size: 22px; font-weight: 800; }
      .card-heading { font-size: 21px; font-weight: 800; }
      .body { font-size: 17px; font-weight: 500; fill: #475569; }
      .small { font-size: 15px; font-weight: 700; fill: #475569; }
      .footer { font-size: 17px; font-weight: 750; }
    </style>
  </defs>

  <rect width="1400" height="720" rx="32" fill="#f8fafc"/>

  <g filter="url(#shadow)">
    <rect x="40" y="184" width="240" height="338" rx="28" fill="#ffffff" stroke="#bae6fd" stroke-width="2"/>
  </g>
  <rect x="72" y="216" width="136" height="36" rx="18" fill="#e0f2fe"/>
  <text x="140" y="241" class="eyebrow" text-anchor="middle" fill="#0369a1">SOURCE</text>
  <rect x="97" y="279" width="126" height="126" rx="28" fill="#0f172a"/>
  <use href="#rn-logo" x="111" y="294" width="98" height="90"/>
  <text x="160" y="452" class="source-heading" text-anchor="middle">PopPang-RN</text>
  <text x="160" y="485" class="body" text-anchor="middle">JavaScript · Native bridge</text>

  <g filter="url(#shadow)">
    <rect x="330" y="40" width="1030" height="264" rx="28" fill="#ffffff" stroke="#bfdbfe" stroke-width="2"/>
    <rect x="330" y="332" width="1030" height="264" rx="28" fill="#ffffff" stroke="#bbf7d0" stroke-width="2"/>
  </g>

  <circle cx="372" cy="80" r="20" fill="#2563eb"/>

  <path d="M315 353 V450 Q315 466 331 466 H338" fill="none" stroke="#94a3b8" stroke-width="3" marker-end="url(#neutral-arrow)"/>

  <rect x="350" y="120" width="200" height="136" rx="22" fill="#eff6ff" stroke="#bfdbfe" stroke-width="2"/>
  <rect x="595" y="120" width="240" height="136" rx="22" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
  <rect x="880" y="120" width="210" height="136" rx="22" fill="#e0f2fe" stroke="#7dd3fc" stroke-width="2"/>
  <rect x="1135" y="120" width="195" height="136" rx="22" fill="#eff6ff" stroke="#93c5fd" stroke-width="2"/>

  <text x="450" y="174" class="card-heading" text-anchor="middle">Xcode · xcodebuild</text>
  <text x="450" y="211" class="body" text-anchor="middle">빌드 작업과 순서 관리</text>

  <text x="715" y="174" class="card-heading" text-anchor="middle">컴파일러 · 링커</text>
  <text x="715" y="211" class="body" text-anchor="middle">소스 → 프레임워크 바이너리</text>

  <text x="985" y="174" class="card-heading" text-anchor="middle">XCFramework</text>
  <text x="985" y="204" class="body" text-anchor="middle">Device + Simulator</text>
  <text x="985" y="229" class="small" text-anchor="middle">바이너리 · 헤더</text>

  <text x="1232" y="174" class="card-heading" text-anchor="middle">Swift Package</text>
  <text x="1232" y="204" class="body" text-anchor="middle">기존 iOS 앱에서</text>
  <text x="1232" y="229" class="small" text-anchor="middle">대상 바이너리 링크</text>

  <line x1="560" y1="188" x2="583" y2="188" stroke="#38bdf8" stroke-width="3" marker-end="url(#blue-arrow)"/>
  <line x1="845" y1="188" x2="868" y2="188" stroke="#38bdf8" stroke-width="3" marker-end="url(#blue-arrow)"/>
  <line x1="1100" y1="188" x2="1123" y2="188" stroke="#38bdf8" stroke-width="3" marker-end="url(#blue-arrow)"/>

  <rect x="350" y="412" width="200" height="136" rx="22" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="2"/>
  <rect x="595" y="412" width="240" height="136" rx="22" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
  <rect x="880" y="412" width="210" height="136" rx="22" fill="#ecfdf5" stroke="#86efac" stroke-width="2"/>
  <rect x="1135" y="412" width="195" height="136" rx="22" fill="#f0fdf4" stroke="#86efac" stroke-width="2"/>

  <text x="450" y="466" class="card-heading" text-anchor="middle">Gradle · AGP</text>
  <text x="450" y="503" class="body" text-anchor="middle">빌드 작업과 순서 관리</text>

  <text x="715" y="466" class="card-heading" text-anchor="middle">Kotlin·Java + NDK</text>
  <text x="715" y="503" class="body" text-anchor="middle">class + 네이티브 .so</text>

  <text x="985" y="466" class="card-heading" text-anchor="middle">AAR · Maven</text>
  <text x="985" y="496" class="body" text-anchor="middle">코드 · 리소스</text>
  <text x="985" y="521" class="small" text-anchor="middle">버전 · 의존성 메타데이터</text>

  <text x="1232" y="466" class="card-heading" text-anchor="middle">Gradle 의존성</text>
  <text x="1232" y="496" class="body" text-anchor="middle">DEX 변환 후</text>
  <text x="1232" y="521" class="small" text-anchor="middle">APK · AAB에 병합</text>

  <line x1="560" y1="480" x2="583" y2="480" stroke="#22c55e" stroke-width="3" marker-end="url(#green-arrow)"/>

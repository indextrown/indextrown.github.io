<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" width="960" height="600" font-family="'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#64748b"/></marker>
    <g id="frame"><rect width="300" height="60" fill="#ffffff" fill-opacity="0.55" stroke="#94a3b8"/></g>
  </defs>
  <rect x="1" y="1" width="958" height="598" rx="16" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="40" y="48" font-size="22" font-weight="700" fill="#0f172a">Layer는 투명한 필름을 쌓는 것과 같습니다</text>
  <text x="40" y="74" font-size="14" fill="#64748b">배열 index 0이 가장 아래, 나중에 추가한 Layer가 위에 그려집니다</text>

  <!-- sheets: matrix(1,0,-0.6667,1,140,Y) -->
  <!-- [0] background Y=505 -->
  <g transform="matrix(1,0,-0.6667,1,140,505)">
    <rect width="300" height="60" fill="#e2e8f0" stroke="#94a3b8"/>
  </g>
  <!-- [1] water Y=425 -->
  <g transform="matrix(1,0,-0.6667,1,140,425)">
    <use href="#frame"/>
    <path d="M0,0 L70,0 L85,30 L60,60 L0,60 Z" fill="#93c5fd"/>
  </g>
  <!-- [2] road Y=345 -->
  <g transform="matrix(1,0,-0.6667,1,140,345)">
    <use href="#frame"/>
    <path d="M60,45 L300,22" stroke="#f59e0b" stroke-width="5" fill="none"/>
    <path d="M190,0 L205,60" stroke="#f59e0b" stroke-width="4" fill="none"/>
  </g>
  <!-- [3] building Y=265 -->
  <g transform="matrix(1,0,-0.6667,1,140,265)">
    <use href="#frame"/>
    <g fill="#cbd5e1" stroke="#64748b"><rect x="225" y="6" width="30" height="12"/><rect x="262" y="8" width="24" height="10"/><rect x="130" y="44" width="32" height="12"/><rect x="100" y="6" width="22" height="12"/></g>
  </g>
  <!-- [4] cafe-circles Y=185 -->
  <g transform="matrix(1,0,-0.6667,1,140,185)">
    <use href="#frame"/>
    <circle cx="140" cy="25" r="7" fill="#8b5a2b" stroke="#fff" stroke-width="2"/>
    <circle cx="250" cy="40" r="7" fill="#e53935" stroke="#fff" stroke-width="2"/>
  </g>
  <!-- [5] cafe-labels Y=105 -->
  <g transform="matrix(1,0,-0.6667,1,140,105)">
    <use href="#frame"/>
    <text x="122" y="22" font-size="12" font-weight="700" fill="#0f172a">A카페</text>
    <text x="232" y="38" font-size="12" font-weight="700" fill="#0f172a">B식당</text>
  </g>

  <!-- labels -->
  <g stroke="#cbd5e1" stroke-dasharray="3 3">
    <line x1="430" y1="135" x2="470" y2="135"/><line x1="430" y1="215" x2="470" y2="215"/><line x1="430" y1="295" x2="470" y2="295"/>
    <line x1="430" y1="375" x2="470" y2="375"/><line x1="430" y1="455" x2="470" y2="455"/><line x1="430" y1="535" x2="470" y2="535"/>
  </g>
  <g font-size="12" fill="#64748b">
    <text x="480" y="132" font-size="15" font-weight="700" fill="#0f172a">[5] cafe-labels</text><text x="480" y="150">symbol · "cafes"</text>
    <text x="480" y="212" font-size="15" font-weight="700" fill="#0f172a">[4] cafe-circles</text><text x="480" y="230">circle · "cafes"</text>
    <text x="480" y="292" font-size="15" font-weight="700" fill="#0f172a">[3] building</text><text x="480" y="310">fill · composite</text>
    <text x="480" y="372" font-size="15" font-weight="700" fill="#0f172a">[2] road</text><text x="480" y="390">line · composite</text>
    <text x="480" y="452" font-size="15" font-weight="700" fill="#0f172a">[1] water</text><text x="480" y="470">fill · composite</text>
    <text x="480" y="532" font-size="15" font-weight="700" fill="#0f172a">[0] background</text><text x="480" y="550">background</text>
  </g>

  <!-- result -->
  <line x1="640" y1="330" x2="700" y2="330" stroke="#64748b" stroke-width="2" marker-end="url(#a)"/>
  <text x="815" y="225" font-size="15" font-weight="700" fill="#15803d" text-anchor="middle">위에서 내려다본 결과</text>
  <g transform="translate(715,245)">
    <rect width="200" height="170" rx="8" fill="#e2e8f0" stroke="#94a3b8"/>
    <path d="M0,0 L47,0 L57,85 L40,170 L0,170 Z" fill="#93c5fd"/>
    <path d="M40,128 L200,62" stroke="#f59e0b" stroke-width="6" fill="none"/>
    <path d="M127,0 L137,170" stroke="#f59e0b" stroke-width="5" fill="none"/>
    <g fill="#cbd5e1" stroke="#64748b"><rect x="150" y="18" width="22" height="14"/><rect x="176" y="22" width="16" height="12"/><rect x="87" y="148" width="24" height="14"/><rect x="66" y="16" width="16" height="14"/></g>
    <circle cx="93" cy="70" r="8" fill="#8b5a2b" stroke="#fff" stroke-width="2"/>
    <text x="93" y="96" font-size="12" font-weight="700" fill="#0f172a" text-anchor="middle">A카페</text>
    <circle cx="166" cy="112" r="8" fill="#e53935" stroke="#fff" stroke-width="2"/>
    <text x="166" y="138" font-size="12" font-weight="700" fill="#0f172a" text-anchor="middle">B식당</text>
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 470" width="960" height="470" font-family="'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif">
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#64748b"/></marker>
  <marker id="o" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#ea580c"/></marker></defs>
  <rect x="1" y="1" width="958" height="468" rx="16" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="40" y="48" font-size="22" font-weight="700" fill="#0f172a">CustomLayer의 위치와 생명주기</text>

  <!-- layer stack -->
  <rect x="24" y="80" width="250" height="360" rx="12" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="44" y="108" font-size="15" font-weight="700" fill="#334155">Style의 Layer 배열</text>
  <text x="44" y="127" font-size="12" fill="#64748b">다른 Layer와 똑같이 한 자리를 차지</text>
  <g font-size="13">
    <rect x="44" y="145" width="210" height="40" rx="8" fill="#fff" stroke="#e2e8f0"/><text x="58" y="170" fill="#334155">road-label (symbol)</text>
    <rect x="44" y="193" width="210" height="52" rx="8" fill="#fff7ed" stroke="#ea580c" stroke-width="2"/><text x="58" y="215" font-weight="700" fill="#c2410c">my-custom (custom)</text><text x="58" y="234" font-size="11" fill="#9a3412">Source 없음 · renderer가 그림</text>
    <rect x="44" y="253" width="210" height="40" rx="8" fill="#fff" stroke="#e2e8f0"/><text x="58" y="278" fill="#334155">road (line)</text>
    <rect x="44" y="301" width="210" height="40" rx="8" fill="#fff" stroke="#e2e8f0"/><text x="58" y="326" fill="#334155">water (fill)</text>
    <rect x="44" y="349" width="210" height="40" rx="8" fill="#fff" stroke="#e2e8f0"/><text x="58" y="374" fill="#334155">background</text>
  </g>
  <text x="44" y="418" font-size="11" fill="#64748b">road 위, 라벨 아래에 그려짐</text>

  <path d="M256,219 C290,219 290,140 316,140" fill="none" stroke="#ea580c" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#o)"/>

  <!-- lifecycle -->
  <text x="320" y="108" font-size="15" font-weight="700" fill="#334155">CustomLayerHost (내가 구현하는 renderer)</text>
  <!-- start -->
  <rect x="320" y="122" width="610" height="76" rx="10" fill="#eff6ff" stroke="#3b82f6"/>
  <text x="338" y="146" font-size="14" font-weight="700" fill="#1d4ed8">renderingWillStart(_:colorPixelFormat:depthStencilPixelFormat:)</text>
  <text x="338" y="168" font-size="12" fill="#334155">1번 호출 · 무거운 준비 작업</text>
  <text x="338" y="187" font-size="12" fill="#475569" font-family="Menlo,monospace">MTLDevice → MTLLibrary · MTLRenderPipelineState · MTLBuffer 생성</text>

  <!-- render loop -->
  <rect x="320" y="222" width="610" height="130" rx="10" fill="#fff7ed" stroke="#ea580c"/>
  <text x="338" y="246" font-size="14" font-weight="700" fill="#c2410c">render(_:mtlCommandBuffer:mtlRenderPassDescriptor:)</text>
  <text x="338" y="268" font-size="12" fill="#334155">매 프레임 호출 · 가볍게 유지</text>
  <g font-size="12" fill="#0f172a">
    <rect x="338" y="282" width="128" height="50" rx="8" fill="#fff" stroke="#fed7aa"/><text x="402" y="303" text-anchor="middle">① Encoder 생성</text><text x="402" y="320" text-anchor="middle" font-size="10" fill="#64748b">from commandBuffer</text>
    <rect x="484" y="282" width="128" height="50" rx="8" fill="#fff" stroke="#fed7aa"/><text x="548" y="303" text-anchor="middle">② 상태 · 버퍼 설정</text><text x="548" y="320" text-anchor="middle" font-size="10" fill="#64748b">pipeline, MVP 행렬</text>
    <rect x="630" y="282" width="128" height="50" rx="8" fill="#fff" stroke="#fed7aa"/><text x="694" y="303" text-anchor="middle">③ draw 호출</text><text x="694" y="320" text-anchor="middle" font-size="10" fill="#64748b">drawPrimitives</text>
    <rect x="776" y="282" width="136" height="50" rx="8" fill="#fff" stroke="#fed7aa"/><text x="844" y="303" text-anchor="middle">④ endEncoding()</text><text x="844" y="320" text-anchor="middle" font-size="10" fill="#dc2626">commit은 하지 않음</text>
  </g>
  <g stroke="#64748b" stroke-width="1.5" marker-end="url(#a)"><line x1="467" y1="307" x2="481" y2="307"/><line x1="613" y1="307" x2="627" y2="307"/><line x1="759" y1="307" x2="773" y2="307"/></g>
  <path d="M900,246 C925,246 925,226 900,232" fill="none"/>
  <text x="912" y="250" font-size="18" fill="#ea580c" text-anchor="end">↻</text>

  <!-- end -->
  <rect x="320" y="376" width="610" height="64" rx="10" fill="#f1f5f9" stroke="#94a3b8"/>
  <text x="338" y="400" font-size="14" font-weight="700" fill="#334155">renderingWillEnd()</text>
  <text x="338" y="422" font-size="12" fill="#475569">1번 호출 · 만든 리소스 정리 (renderingWillStart 없이 호출될 수도 있음)</text>

  <g stroke="#64748b" stroke-width="2" marker-end="url(#a)"><line x1="625" y1="199" x2="625" y2="219"/><line x1="625" y1="353" x2="625" y2="373"/></g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 470" width="960" height="470" font-family="'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif">
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#64748b"/></marker>
  <marker id="o" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#ea580c"/></marker></defs>
  <rect x="1" y="1" width="958" height="468" rx="16" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="40" y="48" font-size="22" font-weight="700" fill="#0f172a">Mapbox가 한 프레임을 그리는 과정</text>
  <text x="40" y="72" font-size="14" fill="#64748b">Layer 배열 순서대로 하나의 Command Buffer에 그리기 명령을 기록합니다</text>

  <rect x="30" y="92" width="680" height="266" rx="12" fill="#f8fafc" stroke="#94a3b8"/>
  <text x="48" y="118" font-size="14" font-weight="700" fill="#334155">MTLCommandBuffer</text>
  <text x="188" y="118" font-size="12" fill="#64748b">이번 프레임의 주문서 · 모든 Layer가 같은 render pass(같은 도화지)에 그림</text>

  <g font-size="13" text-anchor="middle">
    <rect x="48" y="136" width="118" height="70" rx="8" fill="#fff" stroke="#cbd5e1"/><text x="107" y="166" fill="#0f172a" font-weight="700">background</text><text x="107" y="186" font-size="11" fill="#64748b">draw</text>
    <rect x="178" y="136" width="118" height="70" rx="8" fill="#fff" stroke="#cbd5e1"/><text x="237" y="166" fill="#0f172a" font-weight="700">water</text><text x="237" y="186" font-size="11" fill="#64748b">draw × 타일 수</text>
    <rect x="308" y="136" width="118" height="70" rx="8" fill="#fff" stroke="#cbd5e1"/><text x="367" y="166" fill="#0f172a" font-weight="700">road</text><text x="367" y="186" font-size="11" fill="#64748b">draw × 타일 수</text>
    <rect x="438" y="136" width="118" height="70" rx="8" fill="#fff7ed" stroke="#ea580c" stroke-width="2"/><text x="497" y="166" fill="#c2410c" font-weight="700">my-custom</text><text x="497" y="186" font-size="11" fill="#9a3412">render() 호출</text>
    <rect x="568" y="136" width="118" height="70" rx="8" fill="#fff" stroke="#cbd5e1"/><text x="627" y="166" fill="#0f172a" font-weight="700">road-label</text><text x="627" y="186" font-size="11" fill="#64748b">draw</text>
  </g>
  <g stroke="#94a3b8" stroke-width="1.5" marker-end="url(#a)"><line x1="167" y1="171" x2="176" y2="171"/><line x1="297" y1="171" x2="306" y2="171"/><line x1="427" y1="171" x2="436" y2="171"/><line x1="557" y1="171" x2="566" y2="171"/></g>

  <!-- zoom into custom -->
  <path d="M497,207 L497,232" stroke="#ea580c" stroke-width="2" marker-end="url(#o)"/>
  <rect x="48" y="238" width="638" height="104" rx="10" fill="#fff7ed" stroke="#fdba74"/>
  <text x="66" y="262" font-size="13" font-weight="700" fill="#c2410c">내 render(parameters, mtlCommandBuffer, mtlRenderPassDescriptor) 안에서</text>
  <g font-size="12" text-anchor="middle">
    <rect x="66" y="276" width="140" height="48" rx="8" fill="#fff" stroke="#fed7aa"/><text x="136" y="296" fill="#0f172a" font-size="10.5">makeRenderCommandEncoder</text><text x="136" y="313" font-size="10" fill="#64748b">Mapbox가 준 descriptor로</text>
    <rect x="222" y="276" width="140" height="48" rx="8" fill="#fff" stroke="#fed7aa"/><text x="292" y="296" fill="#0f172a">상태 · 버퍼 설정</text><text x="292" y="313" font-size="10" fill="#64748b">pipeline, MVP</text>
    <rect x="378" y="276" width="140" height="48" rx="8" fill="#fff" stroke="#fed7aa"/><text x="448" y="296" fill="#0f172a">drawPrimitives</text><text x="448" y="313" font-size="10" fill="#64748b">기록만, 아직 안 그림</text>
    <rect x="534" y="276" width="140" height="48" rx="8" fill="#fff" stroke="#fed7aa"/><text x="604" y="296" fill="#0f172a">endEncoding</text><text x="604" y="313" font-size="10" fill="#dc2626">commit 금지</text>
  </g>
  <g stroke="#94a3b8" stroke-width="1.5" marker-end="url(#a)"><line x1="207" y1="300" x2="219" y2="300"/><line x1="363" y1="300" x2="375" y2="300"/><line x1="519" y1="300" x2="531" y2="300"/></g>

  <!-- right column -->
  <g font-size="13" text-anchor="middle">
    <rect x="745" y="110" width="185" height="58" rx="10" fill="#eff6ff" stroke="#3b82f6"/><text x="837" y="135" font-weight="700" fill="#1d4ed8">commit()</text><text x="837" y="155" font-size="11" fill="#475569">마지막 Layer까지 기록 후 Mapbox가</text>
    <rect x="745" y="198" width="185" height="58" rx="10" fill="#f8fafc" stroke="#cbd5e1"/><text x="837" y="223" font-weight="700" fill="#0f172a">GPU 실행</text><text x="837" y="243" font-size="11" fill="#475569">이때 실제로 픽셀이 칠해짐</text>
    <rect x="745" y="286" width="185" height="58" rx="10" fill="#f0fdf4" stroke="#22c55e"/><text x="837" y="311" font-weight="700" fill="#15803d">화면에 표시</text><text x="837" y="331" font-size="11" fill="#475569">present (drawable)</text>
  </g>
  <path d="M711,171 C728,171 728,139 742,139" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#a)"/>
  <g stroke="#64748b" stroke-width="2" marker-end="url(#a)"><line x1="837" y1="169" x2="837" y2="195"/><line x1="837" y1="257" x2="837" y2="283"/></g>

  <g font-size="12" fill="#475569">
    <text x="40" y="392">• render()가 호출될 때는 "그리기 명령을 기록"할 뿐이고, 실제 그리기는 commit 이후 GPU에서 한꺼번에 일어납니다.</text>
    <text x="40" y="414">• 같은 도화지(render pass)에 이어서 그리기 때문에 내 그림 아래에는 water, road가, 위에는 road-label이 겹쳐집니다.</text>
    <text x="40" y="436">• 지도에 변화가 없으면 이 과정 자체가 일어나지 않습니다. 애니메이션은 triggerRepaint()로 다음 프레임을 요청해야 합니다.</text>
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 470" width="960" height="470" font-family="'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif">
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#64748b"/></marker><marker id="p" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#7c3aed"/></marker><marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker></defs>
<rect x="1" y="1" width="958" height="468" rx="16" fill="#ffffff" stroke="#e2e8f0"/>
<text x="40" y="48" font-size="22" font-weight="700" fill="#0f172a">정적 라이브러리와 동적 라이브러리</text>
<text x="40" y="74" font-size="13" fill="#64748b">빈칸을 언제 채우느냐의 차이. 정적은 빌드할 때, 동적은 실행할 때</text>
<text x="40" y="110" font-size="15" fill="#0f172a" font-weight="700" text-anchor="start" xml:space="preserve">빌드할 때</text>
<rect x="40" y="124" width="250" height="120" rx="10" fill="#f0fdf4" stroke="#22c55e"/>
<text x="54" y="148" font-size="14" font-weight="700" fill="#15803d">libmininav.a  (2,544바이트)</text>
<text x="54" y="170" font-size="12" fill="#166534" font-family="Menlo,Consolas,monospace" xml:space="preserve">$ ar t libmininav.a</text>
<text x="54" y="189" font-size="12" fill="#166534" font-family="Menlo,Consolas,monospace" xml:space="preserve">__.SYMDEF SORTED</text>
<text x="54" y="208" font-size="12" fill="#166534" font-family="Menlo,Consolas,monospace" xml:space="preserve">nav.o</text>
<text x="54" y="227" font-size="12" fill="#166534" font-family="Menlo,Consolas,monospace" xml:space="preserve">mininav_c.o</text>
<rect x="320" y="124" width="140" height="120" rx="10" fill="#f5f3ff" stroke="#8b5cf6"/>
<text x="334" y="148" font-size="14" font-weight="700" fill="#6d28d9">ld</text>
<text x="334" y="170" font-size="12" fill="#5b21b6" xml:space="preserve">필요한 .o를</text>
<text x="334" y="189" font-size="12" fill="#5b21b6" xml:space="preserve">실행 파일 안에</text>
<text x="334" y="208" font-size="12" fill="#5b21b6" xml:space="preserve">복사해 넣는다</text>
<line x1="292" y1="184" x2="316" y2="184" stroke="#64748b" stroke-width="2" marker-end="url(#a)"/>
<line x1="462" y1="184" x2="486" y2="184" stroke="#64748b" stroke-width="2" marker-end="url(#a)"/>
<rect x="490" y="110" width="430" height="250" rx="10" fill="#f8fafc" stroke="#cbd5e1"/>
<text x="504" y="134" font-size="15" font-weight="700" fill="#334155">app  (실행 파일)</text>
<rect x="510" y="150" width="390" height="50" rx="10" fill="#fff7ed" stroke="#f97316"/>
<text x="524" y="174" font-size="12" fill="#9a3412" font-family="Menlo,Consolas,monospace" xml:space="preserve">main.o 의 기계어</text>
<rect x="510" y="206" width="390" height="50" rx="10" fill="#f0fdf4" stroke="#22c55e"/>
<text x="524" y="230" font-size="12" fill="#166534" font-family="Menlo,Consolas,monospace" xml:space="preserve">nav.o · mininav_c.o 의 기계어   ← .a에서 복사됨</text>
<rect x="510" y="270" width="390" height="74" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-dasharray="6 4"/>
<text x="524" y="294" font-size="11" fill="#334155" xml:space="preserve">필요한 dylib 목록 (otool -L)</text>
<text x="524" y="312" font-size="11" fill="#475569" font-family="Menlo,Consolas,monospace" xml:space="preserve">libc++.1.dylib · libSystem.B.dylib · libswiftCore</text>
<text x="40" y="300" font-size="15" fill="#0f172a" font-weight="700" text-anchor="start" xml:space="preserve">실행할 때</text>
<rect x="40" y="314" width="250" height="120" rx="10" fill="#eff6ff" stroke="#3b82f6" stroke-dasharray="6 4"/>
<text x="54" y="338" font-size="14" font-weight="700" fill="#1d4ed8">/usr/lib/*.dylib</text>
<text x="54" y="360" font-size="12" fill="#1e40af" font-family="Menlo,Consolas,monospace" xml:space="preserve">libc++.1.dylib</text>
<text x="54" y="379" font-size="12" fill="#1e40af" font-family="Menlo,Consolas,monospace" xml:space="preserve">libSystem.B.dylib</text>
<text x="54" y="398" font-size="12" fill="#1e40af" font-family="Menlo,Consolas,monospace" xml:space="preserve">libswiftCore.dylib</text>
<rect x="320" y="314" width="140" height="120" rx="10" fill="#f5f3ff" stroke="#8b5cf6"/>
<text x="334" y="338" font-size="14" font-weight="700" fill="#6d28d9">dyld</text>
<text x="334" y="360" font-size="12" fill="#5b21b6" xml:space="preserve">실행 순간</text>
<text x="334" y="379" font-size="12" fill="#5b21b6" xml:space="preserve">메모리에 올리고</text>
<text x="334" y="398" font-size="12" fill="#5b21b6" xml:space="preserve">연결한다</text>
<line x1="292" y1="374" x2="316" y2="374" stroke="#64748b" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#a)"/>
<path d="M462,374 C480,374 490,330 506,318" fill="none" stroke="#64748b" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#a)"/>
<text x="490" y="392" font-size="12" fill="#475569" text-anchor="start" xml:space="preserve">SwiftPM의 CMiniNav 같은 라이브러리 타겟은 기본이 정적 링크</text>
<text x="490" y="414" font-size="12" fill="#475569" text-anchor="start" xml:space="preserve">→ 앱에 붙인 C++ 코드는 앱 실행 파일 안에 들어간다</text>
<text x="490" y="436" font-size="12" fill="#475569" text-anchor="start" xml:space="preserve">-lc++ = C++ 표준 라이브러리는 동적 라이브러리로 연결</text>
</svg>
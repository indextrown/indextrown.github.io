<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="900" viewBox="0 0 1500 900" role="img" aria-labelledby="title desc">
  <title id="title">PopPangListKit의 데이터와 렌더링 경로</title>
  <desc id="desc">UIKit Component와 SwiftUI View가 AnyComponent로 모이고 Cell, Section, List snapshot에 저장된 뒤 CollectionViewAdapter와 공통 UICollectionViewCell을 거쳐 화면에 표시되는 과정</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="7" stdDeviation="10" flood-color="#0f172a" flood-opacity="0.08"/>
    </filter>
    <marker id="arrow" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto">
      <path d="M0,0 L14,7 L0,14 Z" fill="#64748b"/>
    </marker>
    <marker id="blue-arrow" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto">
      <path d="M0,0 L14,7 L0,14 Z" fill="#3182f6"/>
    </marker>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Apple SD Gothic Neo", sans-serif; fill: #0f172a; }
      .title { font-size: 38px; font-weight: 800; }
      .subtitle { font-size: 20px; font-weight: 500; fill: #475569; }
      .heading { font-size: 25px; font-weight: 800; }
      .node { font-size: 20px; font-weight: 750; }
      .hosting-title { font-size: 17px; font-weight: 750; }
      .body { font-size: 17px; font-weight: 500; fill: #475569; }
      .small { font-size: 15px; font-weight: 600; fill: #64748b; }
      .chip { font-size: 17px; font-weight: 750; }
    </style>
  </defs>

  <rect width="1500" height="900" rx="34" fill="#f8fafc"/>
  <text x="60" y="68" class="title">UIKit과 SwiftUI가 같은 리스트 경로를 사용합니다</text>
  <text x="60" y="108" class="subtitle">입력 UI는 달라도 AnyComponent부터 diff, 재사용, 레이아웃까지 하나의 Core가 처리합니다.</text>

  <g filter="url(#shadow)">
    <rect x="40" y="155" width="250" height="140" rx="24" fill="#ffffff" stroke="#93c5fd" stroke-width="2"/>
    <rect x="40" y="365" width="250" height="140" rx="24" fill="#ffffff" stroke="#c4b5fd" stroke-width="2"/>
    <rect x="340" y="365" width="250" height="140" rx="24" fill="#f5f3ff" stroke="#a78bfa" stroke-width="2"/>
    <rect x="650" y="245" width="260" height="180" rx="26" fill="#eff6ff" stroke="#60a5fa" stroke-width="2.5"/>
    <rect x="965" y="275" width="150" height="120" rx="22" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
    <rect x="1160" y="275" width="150" height="120" rx="22" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
    <rect x="1350" y="275" width="110" height="120" rx="22" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
  </g>

  <text x="165" y="199" class="heading" text-anchor="middle">UIKit Component</text>
  <text x="165" y="232" class="body" text-anchor="middle">Item · Content · Coordinator</text>
  <text x="165" y="264" class="small" text-anchor="middle">UIView 생성과 갱신 규칙</text>

  <text x="165" y="415" class="heading" text-anchor="middle">SwiftUI View</text>
  <text x="165" y="449" class="body" text-anchor="middle">Text · Toggle · Card</text>
  <text x="165" y="480" class="small" text-anchor="middle">ViewBuilder로 선언</text>

  <text x="465" y="405" class="hosting-title" text-anchor="middle">SwiftUIHostingComponent</text>
  <text x="465" y="439" class="body" text-anchor="middle">UIHostingController 보관</text>
  <text x="465" y="470" class="small" text-anchor="middle">SwiftUI View를 Component로 변환</text>

  <text x="780" y="295" class="heading" text-anchor="middle">AnyComponent</text>
  <text x="780" y="329" class="body" text-anchor="middle">Item · Content · Coordinator</text>
  <text x="780" y="354" class="small" text-anchor="middle">서로 다른 구체 타입을 소거</text>
  <rect x="685" y="369" width="190" height="42" rx="21" fill="#dbeafe"/>
  <text x="780" y="396" class="chip" text-anchor="middle" fill="#1d4ed8">공통 렌더링 인터페이스</text>

  <text x="1040" y="325" class="node" text-anchor="middle">Cell</text>
  <text x="1040" y="355" class="small" text-anchor="middle">ID · 이벤트</text>
  <text x="1235" y="325" class="node" text-anchor="middle">Section</text>
  <text x="1235" y="355" class="small" text-anchor="middle">Cell · Layout</text>
  <text x="1405" y="325" class="node" text-anchor="middle">List</text>
  <text x="1405" y="355" class="small" text-anchor="middle">snapshot</text>

  <line x1="290" y1="225" x2="638" y2="298" stroke="#3182f6" stroke-width="3" marker-end="url(#blue-arrow)"/>
  <line x1="290" y1="435" x2="328" y2="435" stroke="#7c3aed" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="590" y1="435" x2="638" y2="385" stroke="#7c3aed" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="910" y1="335" x2="953" y2="335" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="1115" y1="335" x2="1148" y2="335" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="1310" y1="335" x2="1338" y2="335" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/>

  <g filter="url(#shadow)">
    <rect x="235" y="610" width="760" height="200" rx="28" fill="#ffffff" stroke="#bfdbfe" stroke-width="2.5"/>
    <rect x="1050" y="625" width="400" height="170" rx="28" fill="#fff7ed" stroke="#fdba74" stroke-width="2.5"/>
  </g>

  <rect x="270" y="642" width="235" height="42" rx="21" fill="#dbeafe"/>
  <text x="388" y="669" class="chip" text-anchor="middle" fill="#1d4ed8">CollectionViewAdapter</text>
  <text x="280" y="722" class="node">DifferenceKit diff</text>
  <text x="280" y="758" class="body">이전 snapshot과 새 snapshot의 변경 계산</text>
  <text x="620" y="722" class="node">Compositional Layout</text>
  <text x="620" y="758" class="body">Section별 세로 · 가로 · 그리드 배치</text>

  <text x="1250" y="675" class="heading" text-anchor="middle">공통 UICollectionViewCell</text>
  <text x="1250" y="716" class="body" text-anchor="middle">UICollectionViewComponentCell</text>
  <text x="1250" y="752" class="small" text-anchor="middle">AnyComponent를 생성하거나 다시 render</text>

  <path d="M1405 395 L1405 540 L900 540 L900 598" fill="none" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="995" y1="710" x2="1038" y2="710" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/>

  <text x="60" y="862" class="subtitle">구체적인 UI 타입은 AnyComponent 경계 안에 남고, 화면과 Adapter는 List snapshot만 다룹니다.</text>
</svg>

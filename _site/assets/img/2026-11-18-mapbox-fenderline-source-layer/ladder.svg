<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" font-family="'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif">
  <defs>
    <marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#64748b"/></marker>
    <marker id="o" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#c2410c"/></marker>
  </defs>
  <rect x="1" y="1" width="958" height="518" rx="16" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="40" y="48" font-size="22" font-weight="700" fill="#0f172a">4가지 방법의 관계</text>
  <text x="40" y="74" font-size="13" fill="#64748b">추상화는 아래에서 위로 높아지지만, "위가 아래로 만들어졌다"는 Annotation → Style Layer만 성립한다</text>

  <!-- 지도 렌더러 영역 -->
  <rect x="40" y="100" width="600" height="390" rx="14" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="60" y="128" font-size="14" font-weight="700" fill="#334155">지도 렌더러가 그림 (Metal)</text>

  <!-- 추상화 화살표 -->
  <line x1="78" y1="440" x2="78" y2="170" stroke="#94a3b8" stroke-width="3" marker-end="url(#g)"/>
  <text x="92" y="300" font-size="13" font-weight="700" fill="#64748b" transform="rotate(-90 92 300)" text-anchor="middle">추상화 높아짐</text>

  <!-- 렌더러 바닥 -->
  <rect x="120" y="420" width="490" height="46" rx="10" fill="#e2e8f0" stroke="#94a3b8"/>
  <text x="365" y="449" font-size="14" font-weight="700" fill="#334155" text-anchor="middle">Mapbox 렌더러 (렌더 패스)</text>

  <!-- Style Layer -->
  <rect x="120" y="300" width="250" height="100" rx="12" fill="#f5f3ff" stroke="#8b5cf6" stroke-width="2"/>
  <text x="140" y="332" font-size="16" font-weight="700" fill="#6d28d9">Style Layer</text>
  <text x="140" y="354" font-size="12" fill="#5b21b6">Source + Layer</text>
  <text x="140" y="378" font-size="12" fill="#475569">엔진 내장 셰이더로 그림</text>

  <!-- Custom Layer -->
  <rect x="390" y="300" width="220" height="100" rx="12" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/>
  <text x="410" y="332" font-size="16" font-weight="700" fill="#1d4ed8">Custom Layer</text>
  <text x="410" y="354" font-size="12" fill="#1e40af">가장 저수준</text>
  <text x="410" y="378" font-size="12" fill="#475569">내 Metal 셰이더로 그림</text>

  <!-- 형제 표시 -->
  <path d="M245,404 V412 H500 V404" fill="none" stroke="#64748b" stroke-width="1.5"/>
  <rect x="262" y="404" width="222" height="16" fill="#f8fafc"/>
  <text x="373" y="416" font-size="11.5" font-weight="700" fill="#475569" text-anchor="middle">같은 Layer 목록의 한 칸 · 그리는 주체만 다름</text>

  <!-- Annotation (Style Layer 위에만) -->
  <rect x="120" y="160" width="250" height="100" rx="12" fill="#fff7ed" stroke="#f97316" stroke-width="2"/>
  <text x="140" y="192" font-size="16" font-weight="700" fill="#c2410c">Annotation</text>
  <text x="140" y="214" font-size="12" fill="#9a3412">가장 추상적 · 객체 단위</text>
  <text x="140" y="238" font-size="12" fill="#475569">매니저 1개 = Source + Layer 1쌍</text>
  <line x1="245" y1="262" x2="245" y2="296" stroke="#c2410c" stroke-width="2" marker-end="url(#o)"/>
  <text x="256" y="284" font-size="11.5" font-weight="700" fill="#c2410c">위에 지어짐</text>

  <!-- Custom Layer 위는 비어 있음 -->
  <rect x="390" y="160" width="220" height="100" rx="12" fill="none" stroke="#cbd5e1" stroke-dasharray="6 5"/>
  <text x="500" y="206" font-size="12" fill="#94a3b8" text-anchor="middle">Style Layer는 Custom Layer로</text>
  <text x="500" y="224" font-size="12" fill="#94a3b8" text-anchor="middle">만들어진 것이 아니다</text>

  <!-- 지도 위 영역 -->
  <rect x="670" y="100" width="250" height="390" rx="14" fill="#ffffff" stroke="#93c5fd" stroke-dasharray="7 5"/>
  <text x="690" y="128" font-size="14" font-weight="700" fill="#1d4ed8">지도 위에 얹음 (UIKit)</text>
  <rect x="690" y="160" width="210" height="110" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="2" stroke-dasharray="7 5"/>
  <text x="710" y="192" font-size="16" font-weight="700" fill="#1d4ed8">View Annotation</text>
  <text x="710" y="216" font-size="12" fill="#475569">실제 UIView를 지도 위에</text>
  <text x="710" y="236" font-size="12" fill="#475569">SDK는 위치만 맞춘다</text>
  <text x="710" y="256" font-size="12" fill="#475569">항상 지도 콘텐츠 위</text>
  <text x="690" y="310" font-size="12.5" font-weight="700" fill="#334155">사다리 밖</text>
  <text x="690" y="332" font-size="12" fill="#475569">지도 렌더러가 그리지 않으므로</text>
  <text x="690" y="350" font-size="12" fill="#475569">추상화 순서에 놓을 수 없다</text>
  <text x="690" y="380" font-size="12" fill="#475569">대신 터치되는 버튼을</text>
  <text x="690" y="398" font-size="12" fill="#475569">그대로 쓸 수 있다</text>
</svg>

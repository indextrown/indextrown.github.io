<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 400" width="960" height="400" font-family="'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif">
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#64748b"/></marker></defs>
  <rect x="1" y="1" width="958" height="398" rx="16" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="40" y="48" font-size="22" font-weight="700" fill="#0f172a">좌표의 여정</text>
  <text x="170" y="48" font-size="14" fill="#64748b">위경도 하나가 화면 픽셀이 되기까지</text>

  <g fill="#f8fafc" stroke="#cbd5e1">
    <rect x="24" y="80" width="160" height="180" rx="12"/>
    <rect x="214" y="80" width="160" height="180" rx="12" fill="#eff6ff" stroke="#93c5fd"/>
    <rect x="404" y="80" width="160" height="180" rx="12" fill="#eff6ff" stroke="#93c5fd"/>
    <rect x="594" y="80" width="160" height="180" rx="12" fill="#fff7ed" stroke="#fdba74"/>
    <rect x="784" y="80" width="160" height="180" rx="12"/>
  </g>
  <g font-size="15" font-weight="700" fill="#0f172a">
    <text x="40" y="108">위경도</text><text x="230" y="108">Mercator</text><text x="420" y="108">World 좌표</text><text x="610" y="108">Clip space</text><text x="800" y="108">화면 픽셀</text>
  </g>
  <g font-size="12" fill="#64748b">
    <text x="40" y="127">degree, 구 위의 각도</text><text x="230" y="127">0 ~ 1 정사각형</text><text x="420" y="127">0 ~ worldSize 픽셀</text><text x="610" y="127">-1 ~ 1 정육면체</text><text x="800" y="127">device pixel</text>
  </g>
  <!-- globe -->
  <circle cx="104" cy="190" r="45" fill="#dbeafe" stroke="#60a5fa"/>
  <ellipse cx="104" cy="190" rx="45" ry="14" fill="none" stroke="#60a5fa"/>
  <ellipse cx="104" cy="190" rx="16" ry="45" fill="none" stroke="#60a5fa"/>
  <circle cx="122" cy="172" r="4" fill="#ea580c"/>
  <text x="104" y="250" font-size="11" fill="#334155" text-anchor="middle" font-family="Menlo,monospace">(37.56, 126.97)</text>
  <!-- mercator square -->
  <rect x="249" y="145" width="90" height="90" fill="#ffffff" stroke="#3b82f6"/>
  <text x="243" y="142" font-size="10" fill="#64748b">0</text><text x="337" y="142" font-size="10" fill="#64748b">1</text>
  <circle cx="326" cy="180" r="4" fill="#ea580c"/>
  <text x="294" y="250" font-size="11" fill="#334155" text-anchor="middle" font-family="Menlo,monospace">(0.853, 0.387)</text>
  <!-- world grid -->
  <g stroke="#bfdbfe"><rect x="434" y="140" width="100" height="100" fill="#ffffff" stroke="#3b82f6"/><line x1="459" y1="140" x2="459" y2="240"/><line x1="484" y1="140" x2="484" y2="240"/><line x1="509" y1="140" x2="509" y2="240"/><line x1="434" y1="165" x2="534" y2="165"/><line x1="434" y1="190" x2="534" y2="190"/><line x1="434" y1="215" x2="534" y2="215"/></g>
  <circle cx="519" cy="179" r="4" fill="#ea580c"/>
  <text x="484" y="252" font-size="10" fill="#334155" text-anchor="middle">worldSize = 512 × 2^zoom</text>
  <!-- clip cube -->
  <g fill="none" stroke="#f97316"><rect x="640" y="160" width="70" height="70"/><rect x="655" y="145" width="70" height="70" stroke-dasharray="3 3"/><line x1="640" y1="160" x2="655" y2="145"/><line x1="710" y1="160" x2="725" y2="145"/><line x1="710" y1="230" x2="725" y2="215"/><line x1="640" y1="230" x2="655" y2="215"/></g>
  <circle cx="690" cy="185" r="4" fill="#ea580c"/>
  <text x="674" y="252" font-size="11" fill="#334155" text-anchor="middle" font-family="Menlo,monospace">(0.42, 0.13, z, w)</text>
  <!-- screen -->
  <rect x="824" y="140" width="80" height="100" rx="10" fill="#0f172a"/><rect x="830" y="148" width="68" height="84" rx="4" fill="#e2e8f0"/>
  <circle cx="872" cy="183" r="4" fill="#ea580c"/>
  <text x="864" y="252" font-size="11" fill="#334155" text-anchor="middle" font-family="Menlo,monospace">(1290, 1020)</text>

  <g stroke="#64748b" stroke-width="2" marker-end="url(#a)">
    <line x1="185" y1="170" x2="211" y2="170"/><line x1="375" y1="170" x2="401" y2="170"/><line x1="565" y1="170" x2="591" y2="170"/><line x1="755" y1="170" x2="781" y2="170"/>
  </g>
  <!-- labels band -->
  <g font-size="12" text-anchor="middle">
    <rect x="124" y="280" width="150" height="54" rx="8" fill="#eff6ff" stroke="#bfdbfe"/>
    <text x="199" y="302" fill="#1d4ed8" font-weight="700">latLngToMercatorXY</text><text x="199" y="321" fill="#475569">Swift · 1번만 계산</text>
    <rect x="314" y="280" width="150" height="54" rx="8" fill="#eff6ff" stroke="#bfdbfe"/>
    <text x="389" y="302" fill="#1d4ed8" font-weight="700">× worldSize</text><text x="389" y="321" fill="#475569">Model 행렬 · 매 프레임</text>
    <rect x="504" y="280" width="150" height="54" rx="8" fill="#fff7ed" stroke="#fed7aa"/>
    <text x="579" y="302" fill="#c2410c" font-weight="700">projectionMatrix</text><text x="579" y="321" fill="#475569">Mapbox가 매 프레임 제공</text>
    <rect x="694" y="280" width="150" height="54" rx="8" fill="#f8fafc" stroke="#e2e8f0"/>
    <text x="769" y="302" fill="#334155" font-weight="700">Viewport 변환</text><text x="769" y="321" fill="#475569">GPU가 자동 처리</text>
  </g>
  <g stroke="#cbd5e1" stroke-dasharray="3 3"><line x1="199" y1="190" x2="199" y2="278"/><line x1="389" y1="190" x2="389" y2="278"/><line x1="579" y1="190" x2="579" y2="278"/><line x1="769" y1="190" x2="769" y2="278"/></g>
  <text x="480" y="372" font-size="13" fill="#64748b" text-anchor="middle">Vertex Shader의 일은 결국 "Model 행렬과 projectionMatrix를 곱해서 Clip space 좌표를 만드는 것"입니다</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="950" viewBox="0 0 1500 950" role="img" aria-labelledby="title desc">
  <title id="title">UICollectionView 셀 의존성이 이동하는 과정</title>
  <desc id="desc">1단계에서는 뷰 컨트롤러가 구체적인 셀을 알고, 2단계에서는 어댑터가 구체적인 셀을 알며, 3단계에서는 셀 등록과 생성 책임이 Component 경계 안의 AnyCollectionComponent와 ContainerCell로 이동한다. 마지막 구조에서 뷰 컨트롤러와 어댑터는 구체적인 셀 타입을 모른다.</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="7" stdDeviation="10" flood-color="#0f172a" flood-opacity="0.08"/>
    </filter>
    <marker id="arrow" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto">
      <path d="M0,0 L14,7 L0,14 Z" fill="#64748b"/>
    </marker>
    <marker id="blue-arrow" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto">
      <path d="M0,0 L14,7 L0,14 Z" fill="#3182f6"/>
    </marker>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Apple SD Gothic Neo", sans-serif; fill: #0f172a; }
      .title { font-size: 38px; font-weight: 800; }
      .subtitle { font-size: 20px; font-weight: 500; fill: #475569; }
      .step { font-size: 18px; font-weight: 800; letter-spacing: 0.8px; }
      .heading { font-size: 27px; font-weight: 800; }
      .node { font-size: 22px; font-weight: 750; }
      .node-compact { font-size: 18px; font-weight: 750; }
      .body { font-size: 17px; font-weight: 500; fill: #475569; }
      .small { font-size: 16px; font-weight: 600; fill: #64748b; }
      .chip { font-size: 18px; font-weight: 750; }
      .summary { font-size: 24px; font-weight: 800; }
      .summary-body { font-size: 18px; font-weight: 550; fill: #475569; }
    </style>
  </defs>

  <rect width="1500" height="950" rx="34" fill="#f8fafc"/>

  <text x="60" y="68" class="title">셀 의존성을 Component 경계 안으로 옮기기</text>
  <text x="60" y="108" class="subtitle">셀 등록·생성·캐스팅 책임은 안쪽으로 이동하고, 외부 코드는 공통 인터페이스만 다룹니다.</text>

  <g filter="url(#shadow)">
    <rect x="40" y="145" width="450" height="620" rx="28" fill="#ffffff" stroke="#e2e8f0" stroke-width="2"/>
    <rect x="525" y="145" width="450" height="620" rx="28" fill="#ffffff" stroke="#e2e8f0" stroke-width="2"/>
    <rect x="1010" y="145" width="450" height="620" rx="28" fill="#ffffff" stroke="#bfdbfe" stroke-width="2"/>
  </g>

  <!-- Step 1 -->
  <rect x="75" y="178" width="88" height="36" rx="18" fill="#fee2e2"/>
  <text x="119" y="202" class="step" text-anchor="middle" fill="#b91c1c">1단계</text>
  <text x="75" y="254" class="heading">뷰 컨트롤러가 셀을 압니다</text>
  <text x="75" y="286" class="body">화면 코드에 셀 세부 구현이 모여 있습니다.</text>

  <rect x="75" y="322" width="380" height="100" rx="20" fill="#fff1f2" stroke="#fda4af" stroke-width="2.5"/>
  <text x="265" y="361" class="node" text-anchor="middle">ViewController</text>
  <text x="265" y="393" class="body" text-anchor="middle">register · dequeue · cast · configure · size</text>

  <line x1="265" y1="422" x2="265" y2="470" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/>

  <rect x="75" y="482" width="380" height="88" rx="20" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
  <text x="265" y="520" class="node" text-anchor="middle">AccountCell · NoticeCell</text>
  <text x="265" y="549" class="body" text-anchor="middle">구체적인 UICollectionViewCell</text>

  <rect x="75" y="663" width="380" height="72" rx="18" fill="#fff1f2"/>
  <text x="265" y="693" class="small" text-anchor="middle">셀 의존성 위치</text>
  <text x="265" y="721" class="chip" text-anchor="middle" fill="#be123c">ViewController</text>

  <!-- Step 2 -->
  <rect x="560" y="178" width="88" height="36" rx="18" fill="#ffedd5"/>
  <text x="604" y="202" class="step" text-anchor="middle" fill="#c2410c">2단계</text>
  <text x="560" y="254" class="heading">어댑터가 셀을 압니다</text>
  <text x="560" y="286" class="body">화면은 짧아졌지만 셀 분기는 남아 있습니다.</text>

  <rect x="560" y="314" width="380" height="68" rx="18" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
  <text x="750" y="356" class="node" text-anchor="middle">ViewController</text>

  <line x1="750" y1="382" x2="750" y2="420" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/>

  <rect x="560" y="432" width="380" height="96" rx="20" fill="#fff7ed" stroke="#fdba74" stroke-width="2.5"/>
  <text x="750" y="469" class="node" text-anchor="middle">FeedCollectionViewAdapter</text>
  <text x="750" y="500" class="body" text-anchor="middle">register · dequeue · cast · configure · size</text>

  <line x1="750" y1="528" x2="750" y2="564" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/>

  <rect x="560" y="576" width="380" height="70" rx="18" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
  <text x="750" y="619" class="node" text-anchor="middle">AccountCell · NoticeCell</text>

  <rect x="560" y="687" width="380" height="48" rx="16" fill="#fff7ed"/>
  <text x="750" y="718" class="chip" text-anchor="middle" fill="#c2410c">셀 의존성 위치: Adapter</text>

  <!-- Step 3 -->
  <rect x="1045" y="178" width="88" height="36" rx="18" fill="#dbeafe"/>
  <text x="1089" y="202" class="step" text-anchor="middle" fill="#1d4ed8">3단계</text>
  <text x="1045" y="254" class="heading">셀 세부 구현을 안쪽에 둡니다</text>
  <text x="1045" y="286" class="body">외부에서는 구체적인 셀 타입을 참조하지 않습니다.</text>

  <rect x="1045" y="310" width="380" height="72" rx="18" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
  <text x="1235" y="339" class="node" text-anchor="middle">ViewController · Adapter</text>
  <text x="1235" y="366" class="small" text-anchor="middle">[AnyCollectionComponent]만 사용</text>

  <line x1="1235" y1="382" x2="1235" y2="416" stroke="#3182f6" stroke-width="3" marker-end="url(#blue-arrow)"/>

  <rect x="1033" y="428" width="404" height="255" rx="22" fill="#eff6ff" stroke="#60a5fa" stroke-width="2.5" stroke-dasharray="10 8"/>
  <rect x="1053" y="447" width="154" height="32" rx="16" fill="#dbeafe"/>
  <text x="1130" y="469" class="small" text-anchor="middle" fill="#1d4ed8">Component 경계</text>

  <rect x="1053" y="493" width="364" height="52" rx="16" fill="#ffffff" stroke="#93c5fd" stroke-width="2"/>
  <text x="1235" y="526" class="node" text-anchor="middle">AnyCollectionComponent</text>

  <line x1="1235" y1="545" x2="1235" y2="570" stroke="#3182f6" stroke-width="2.5"/>
  <line x1="1138" y1="570" x2="1332" y2="570" stroke="#3182f6" stroke-width="2.5"/>
  <line x1="1138" y1="570" x2="1138" y2="586" stroke="#3182f6" stroke-width="2.5" marker-end="url(#blue-arrow)"/>
  <line x1="1332" y1="570" x2="1332" y2="586" stroke="#3182f6" stroke-width="2.5" marker-end="url(#blue-arrow)"/>

  <rect x="1053" y="594" width="170" height="62" rx="16" fill="#ffffff" stroke="#93c5fd" stroke-width="2"/>
  <text x="1138" y="620" class="node" text-anchor="middle">Component</text>
  <text x="1138" y="644" class="small" text-anchor="middle">데이터 · render</text>

  <rect x="1247" y="594" width="170" height="62" rx="16" fill="#fff1f2" stroke="#fda4af" stroke-width="2"/>
  <text x="1332" y="620" class="node-compact" text-anchor="middle">ContainerCell&lt;C&gt;</text>
  <text x="1332" y="644" class="small" text-anchor="middle">register · dequeue</text>

  <rect x="1045" y="697" width="380" height="38" rx="14" fill="#dcfce7"/>
  <text x="1235" y="722" class="chip" text-anchor="middle" fill="#15803d">외부의 구체 셀 참조 0개</text>

  <!-- Summary -->
  <rect x="40" y="795" width="1420" height="125" rx="24" fill="#ffffff" stroke="#dbeafe" stroke-width="2"/>
  <text x="76" y="848" class="summary">의존성 이동</text>
  <rect x="250" y="817" width="190" height="42" rx="21" fill="#fff1f2"/>
  <text x="345" y="844" class="chip" text-anchor="middle" fill="#be123c">ViewController</text>
  <line x1="454" y1="838" x2="514" y2="838" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/>
  <rect x="530" y="817" width="150" height="42" rx="21" fill="#fff7ed"/>
  <text x="605" y="844" class="chip" text-anchor="middle" fill="#c2410c">Adapter</text>
  <line x1="694" y1="838" x2="754" y2="838" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/>
  <rect x="770" y="817" width="240" height="42" rx="21" fill="#dbeafe"/>
  <text x="890" y="844" class="chip" text-anchor="middle" fill="#1d4ed8">Component 경계</text>
  <text x="250" y="895" class="summary-body">마지막 구조에서 ViewController와 Adapter는 셀 등록·생성·캐스팅 방법을 알지 않아도 됩니다.</text>
</svg>
